name: Pack and ship

on:
  workflow_dispatch: # Allow manually running workflow
  release:
    types: [created]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

jobs:
  deploy:
    run-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        env:
          NUGET_AUTH_TOKEN: $${{secrets.NUGET_PACKAGE_API_KEY}}
      - run: dotnet build --configuration Release ChangeLogVersioningTask.csproj
      - name: Create package
        run: dotnet pack --configuration Release --output nuget ChangeLogVersioningTask.csproj
      - name: Publish package
        run: dotnet nuget push nuget/*.nupkg --api-key "${{ secrets.NUGET_PACKAGE_API_KEY }}" --source https://api.nuget.org/v3/index.json
